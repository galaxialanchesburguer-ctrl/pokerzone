
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>PokerZone | Ranking de Poker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 24px;
      border-bottom: 1px solid #292929;
      text-align: center;
    }
    .logo {
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
    }
    .logo span { color: #ed3038; }
    main {
      max-width: 900px;
      margin: 70px auto;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 42px; }
    h1 span { color: #ed3038; }
    p { color: #aaa; line-height: 1.6; }
    .ranking {
      margin-top: 40px;
      padding: 28px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
    }
    .ranking h2 { margin-top: 0; }
    .ranking p { margin-bottom: 0; }
  </style>
</head>
<body>
  <header>
    <div class="logo">POKER<span>ZONE</span></div>
  </header>

  <main>
    <h1>O ranking começa <span>aqui.</span></h1>
    <p>
      Acompanhe os torneios, os jogadores e a disputa
      pelo topo do PokerZone.
    </p>

    <section class="ranking">
      <h2>RANKING DA TEMPORADA</h2>
      <p>Em breve: classificação oficial dos jogadores.</p>
    </section>
  </main>
</body>
</html>
